[package]
name = "local-tana"
version = "0.1.0"
description = "A local-first Tana-style outliner powered by Plite"
authors = ["Plate contributors"]
edition = "2021"

[lib]
name = "local_tana_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
